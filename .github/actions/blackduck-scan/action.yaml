name: Black Duck Container Scan
description: Scans a local Docker image and publishes its notices report

inputs:
  name:
    description: Application name, used to separate Black Duck versions and report artifacts
    required: true
  image:
    description: Local Docker image ID or tag to scan
    required: true
  version:
    description: Image version to record in Black Duck as <name>/<version>
    required: true
  token:
    description: Black Duck API token
    required: true

runs:
  using: composite
  steps:
    - name: Set up Java
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: temurin
        java-version: "25"

    - name: Prepare scan directory
      id: prepare
      shell: bash
      run: |
        directory=$(mktemp -d "${RUNNER_TEMP}/blackduck.XXXXXX")
        mkdir "$directory/reports"
        echo "directory=$directory" >> "$GITHUB_OUTPUT"

    - name: Scan Docker image
      shell: bash
      env:
        BLACKDUCK_HUBDETECT_TOKEN: ${{ inputs.token }}
        SCAN_NAME: ${{ inputs.name }}
        SCAN_IMAGE: ${{ inputs.image }}
        SCAN_VERSION: ${{ inputs.version }}
        SCAN_DIR: ${{ steps.prepare.outputs.directory }}
      run: |
        : "${BLACKDUCK_HUBDETECT_TOKEN:?Black Duck API token is required}"
        # Too many false positives with BLOCKER/CRITICAL, so we set it to NONE for now
        # policy_severities=BLOCKER,CRITICAL
        policy_severities=NONE
        trap 'rm -f -- "$SCAN_DIR/image.tar" "$SCAN_DIR/synopsys-detect"' EXIT
        docker image save "$SCAN_IMAGE" -o "$SCAN_DIR/image.tar"
        curl --fail --silent --show-error --location --retry 3 \
          https://raw.githubusercontent.com/DACH-NY/security-blackduck/master/synopsys-detect \
          -o "$SCAN_DIR/synopsys-detect"
        bash "$SCAN_DIR/synopsys-detect" \
          ci-build "$GITHUB_REPOSITORY" "${SCAN_NAME}/${SCAN_VERSION}" \
          --logging.level.com.synopsys.integration=DEBUG \
          --detect.notices.report=true \
          --detect.notices.report.path="$SCAN_DIR/reports" \
          --detect.timeout=600 \
          --detect.policy.check.fail.on.severities="$policy_severities" \
          --detect.tools=CONTAINER_SCAN \
          --detect.tools.excluded=DETECTOR,SIGNATURE_SCAN \
          --detect.container.scan.file.path="$SCAN_DIR/image.tar"

    - name: Add notices report to job summary
      if: always() && steps.prepare.outcome == 'success'
      shell: bash
      env:
        SCAN_DIR: ${{ steps.prepare.outputs.directory }}
      run: |
        shopt -s nullglob
        reports=("$SCAN_DIR"/reports/*Notices_Report*)
        if [ ${#reports[@]} -eq 0 ]; then
          echo "No Black Duck notices report was generated." >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        {
          echo "## Black Duck Notices Report"
          echo "<details><summary>${reports[0]##*/}</summary>"
          echo
          echo '```'
          # Job summaries are limited to 1 MiB; the full reports are in the artifact.
          head -c 900000 "${reports[0]}"
          echo
          echo '```'
          echo "</details>"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload notices reports
      if: always() && steps.prepare.outcome == 'success'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: blackduck-notices-report-${{ inputs.name }}
        path: ${{ steps.prepare.outputs.directory }}/reports/
        if-no-files-found: warn
