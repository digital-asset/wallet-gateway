name: Black Duck Container Scan
description: Scans a local Docker image with Black Duck

inputs:
  name:
    description: Application name, used to separate Black Duck versions
    required: true
  image:
    description: Local Docker image ID or tag to scan
    required: true
  version:
    description: Stable image version, used by ci-release as <name>/<version>
    default: ""
  branch:
    description: Source branch, used by ci-build as <name>/<branch>
    default: ${{ github.ref_name }}
  stable-tags:
    description: Stable tags being published; empty for unstable builds
    default: ""
  policy-severities:
    description: Policy violation severities that fail the scan (NONE disables enforcement)
    default: NONE
  token:
    description: Black Duck API token
    required: true

runs:
  using: composite
  steps:
    - name: Set up Java
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: temurin
        java-version: "25"

    - name: Prepare scan directory
      id: prepare
      shell: bash
      run: |
        directory=$(mktemp -d "${RUNNER_TEMP}/blackduck.XXXXXX")
        echo "directory=$directory" >> "$GITHUB_OUTPUT"

    - name: Scan Docker image
      shell: bash
      env:
        BLACKDUCK_HUBDETECT_TOKEN: ${{ inputs.token }}
        SCAN_NAME: ${{ inputs.name }}
        SCAN_IMAGE: ${{ inputs.image }}
        SCAN_VERSION: ${{ inputs.version }}
        SCAN_BRANCH: ${{ inputs.branch }}
        STABLE_TAGS: ${{ inputs.stable-tags }}
        POLICY_SEVERITIES: ${{ inputs.policy-severities }}
        SCAN_DIR: ${{ steps.prepare.outputs.directory }}
      run: |
        if [ -n "$STABLE_TAGS" ]; then
          scan_type=ci-release
          scan_ref="${SCAN_NAME}/${SCAN_VERSION}"
        else
          scan_type=ci-build
          scan_ref="${SCAN_NAME}/${SCAN_BRANCH}"
        fi
        trap 'rm -f -- "$SCAN_DIR/image.tar"' EXIT
        docker image save "$SCAN_IMAGE" -o "$SCAN_DIR/image.tar"
        curl --fail --silent --show-error --location --retry 3 \
          https://raw.githubusercontent.com/DACH-NY/security-blackduck/master/synopsys-detect |
          bash -s -- \
          "$scan_type" "$GITHUB_REPOSITORY" "$scan_ref" \
          --logging.level.com.synopsys.integration=DEBUG \
          --detect.timeout=600 \
          --detect.policy.check.fail.on.severities="$POLICY_SEVERITIES" \
          --detect.tools=CONTAINER_SCAN \
          --detect.tools.excluded=DETECTOR,SIGNATURE_SCAN \
          --detect.container.scan.file.path="$SCAN_DIR/image.tar"
