name: nightly

on:
  schedule:
    - cron: "23 23 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  build-and-scan:
    runs-on: digital-asset-wallet-gateway
    steps:
      - name: Checkout image build configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout latest upstream main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: canton-network/wallet
          ref: main
          path: wallet
          persist-credentials: false

      - name: Record upstream revision
        shell: bash
        run: |
          revision=$(git -C wallet rev-parse HEAD)
          echo "Nightly source: https://github.com/canton-network/wallet/commit/$revision" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Wallet Gateway image
        id: gateway
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-contexts: wallet=./wallet
          file: ./apps/Dockerfile.nightly
          target: wallet-gateway
          load: true
          tags: ghcr.io/digital-asset/wallet-gateway-unstable/docker/wallet-gateway:nightly

      - name: Test container initializes successfully
        run: ./bin/test-container-init.sh ${{ steps.gateway.outputs.imageid }}

      - name: Build Splice Portfolio image
        id: portfolio
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-contexts: wallet=./wallet
          file: ./apps/Dockerfile.nightly
          target: splice-portfolio
          load: true
          tags: ghcr.io/digital-asset/splice-portfolio-unstable/docker/splice-portfolio:nightly

      - name: Test container serves portfolio
        run: ./bin/test-portfolio-container.sh ${{ steps.portfolio.outputs.imageid }}

      - name: Scan nightly Wallet Gateway
        id: gateway-scan
        continue-on-error: true
        uses: ./.github/actions/blackduck-scan
        with:
          name: wallet-gateway
          image: ${{ steps.gateway.outputs.imageid }}
          branch: nightly
          policy-severities: MAJOR,CRITICAL,BLOCKER
          token: ${{ secrets.DA_BLACKDUCK }}

      - name: Scan nightly Splice Portfolio
        id: portfolio-scan
        continue-on-error: true
        uses: ./.github/actions/blackduck-scan
        with:
          name: splice-portfolio
          image: ${{ steps.portfolio.outputs.imageid }}
          branch: nightly
          policy-severities: MAJOR,CRITICAL,BLOCKER
          token: ${{ secrets.DA_BLACKDUCK }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish nightly images
        shell: bash
        run: |
          docker push ghcr.io/digital-asset/wallet-gateway-unstable/docker/wallet-gateway:nightly
          docker push ghcr.io/digital-asset/splice-portfolio-unstable/docker/splice-portfolio:nightly

      - name: Report nightly failures
        if: ${{ !cancelled() && (failure() || steps.gateway-scan.outcome == 'failure' || steps.portfolio-scan.outcome == 'failure') }}
        shell: bash
        env:
          GATEWAY_SCAN: ${{ steps.gateway-scan.outcome }}
          PORTFOLIO_SCAN: ${{ steps.portfolio-scan.outcome }}
        run: |
          echo "::warning title=Nightly failure::A build, smoke test, Black Duck scan/policy check, or publish step failed. See the failed step logs. Scan failures do not block publication."
          {
            echo "## Nightly failure"
            echo "A build, smoke test, Black Duck scan/policy check, or publish step failed. See the failed step logs."
            echo
            echo "| Black Duck scan | Outcome |"
            echo "| --- | --- |"
            echo "| Wallet Gateway | $GATEWAY_SCAN |"
            echo "| Splice Portfolio | $PORTFOLIO_SCAN |"
            echo
            echo "Scan failures do not block publication."
          } >> "$GITHUB_STEP_SUMMARY"
