name: wallet-gateway
on:
  - push

defaults:
  run:
    shell: nix-shell --run "exec bash -euo pipefail {0}"

jobs:
  check:
    runs-on: digital-asset-wallet-gateway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: helm unittest -v charts/wallet-gateway/values.test.yaml charts/wallet-gateway
      - run: ./bin/helm-gen wallet-gateway
      - run: ./.github/scripts/git-dirty-check

  docker-build-and-publish:
    runs-on: digital-asset-wallet-gateway
    permissions:
      contents: read
      packages: write
    needs:
      - check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generate outputs for downstream jobs
      - name: Versions
        id: versions
        uses: ./.github/actions/versions
        with:
          name: wallet-gateway
      - name: Docker Tags
        id: tags
        uses: ./.github/actions/docker-tags
        with:
          name: wallet-gateway
          registry-unstable: ghcr.io/digital-asset/wallet-gateway-unstable/docker
          registry-stable: ghcr.io/digital-asset/wallet-gateway/docker

        # Build first for testing (no publish): https://docs.docker.com/build/ci/github-actions/test-before-push/
      - name: Build and export to Docker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: docker-export
        with:
          context: .
          file: ./apps/wallet-gateway/Dockerfile
          load: true

      - name: Test container initializes successfully
        run: ./bin/test-container-init.sh ${{ steps.versions.outputs.stable }} ${{ steps.docker-export.outputs.imageid }}

      # Setup buildx for multi-platform
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Actually publish the docker image
      - name: Docker Build and Publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./apps/wallet-gateway/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}

  helm-publish:
    runs-on: digital-asset-wallet-gateway
    permissions:
      contents: read
      packages: write
    needs:
      - check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Helm Build and Publish
        uses: ./.github/actions/helm-build-push
        with:
          name: wallet-gateway
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry-unstable: ghcr.io/digital-asset/wallet-gateway-unstable/helm
          registry-stable: ghcr.io/digital-asset/wallet-gateway/helm
