# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: all
release:
  name: splice-portfolio
  namespace: splice-portfolio
tests:
  - it: should be valid manifests
    postRenderer:
      cmd: bash
      args:
        - -c
        - |
          set -euo pipefail

          # cache directory for kubeconform
          mkdir -p cache/kubeconform

          # clone fd/1
          exec {out}<&1

          # tee all stdin back out to fd/1 via the clone, then tee to cat to
          # add line numbers, then tee to kubeconform which will validate the
          # rendered manifest
          tee >(cat >&${out}) | \
          tee >(cat -n >&2) | \
          kubeconform -verbose -strict -cache cache/kubeconform >&2
    asserts:
      - hasDocuments:
          count: 1

  - it: should render a deployment
    templates:
      - deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - isNull:
          path: spec.template.spec.nodeSelector
      - isNull:
          path: spec.template.spec.affinity
      - isNull:
          path: spec.template.spec.tolerations
  - it: should render scheduling values
    templates:
      - deployment.yaml
    values:
      - scheduling_values.yaml
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector.agentpool
          value: app
      - equal:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions
          value:
            - key: cn_apps
              operator: Exists
            - key: cn_apps
              operator: In
              values:
                - hyperdisk
      - contains:
          path: spec.template.spec.tolerations
          content:
            key: cn_apps
            operator: Exists
            effect: NoSchedule
  - it: should render a service
    templates:
      - service.yaml
    asserts:
      - isKind:
          of: Service
  - it: should render a configmap (correctly)
    templates:
      - configmap.yaml
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: data["config.json"]
          value: |
            {
              "amulet": {
                "registry": "http://scan.localhost:4000/registry/",
                "validatorUrl": "http://localhost:2000/api/validator"
              },
              "token": {
                "registries": [
                  {
                    "name": "",
                    "partyId": "party-hint::fingerprint",
                    "url": "https://registry.example.com"
                  }
                ],
                "validatorUrl": "http://localhost:2000/api/validator"
              }
            }
