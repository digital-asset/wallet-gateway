nodeSelector:
  agentpool: app

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: cn_apps
              operator: Exists
            - key: cn_apps
              operator: In
              values:
                - hyperdisk

tolerations:
  - key: cn_apps
    operator: Exists
    effect: NoSchedule
