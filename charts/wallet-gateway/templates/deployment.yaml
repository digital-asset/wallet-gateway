apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Release.Name}}-wallet-gateway"
  namespace: "{{ .Release.Namespace }}"
  labels:
    app: "{{ .Release.Name}}-wallet-gateway"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "{{ .Release.Name}}-wallet-gateway"
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: "{{ .Release.Name}}-wallet-gateway"
    spec:
      containers:
        - name: wallet-gateway
          image: "{{ .Values.image.repo }}/wallet-gateway:{{  .Values.image.tag | default (printf "v%s" .Chart.Version) }}"
          imagePullPolicy: Always
          env:
            {{- /* FIREBLOCKS env vars */ -}}
            {{- if hasKey .Values.envFromSecrets "FIREBLOCKS_API_KEY" }}
              {{- include "wallet-gateway.render.secretEnv" (dict "root" $ "envName" "FIREBLOCKS_API_KEY") | nindent 12 }}
            {{- end }}
            {{- if hasKey .Values.envFromSecrets "FIREBLOCKS_SECRET" }}
              {{- include "wallet-gateway.render.secretEnv" (dict "root" $ "envName" "FIREBLOCKS_SECRET") | nindent 12 }}
            {{- end }}

            {{- /* BLOCKDAEMON env vars */ -}}
            {{- if hasKey .Values.envFromSecrets "BLOCKDAEMON_API_URL" }}
              {{- include "wallet-gateway.render.secretEnv" (dict "root" $ "envName" "BLOCKDAEMON_API_URL") | nindent 12 }}
            {{- end }}
            {{- if hasKey .Values.envFromSecrets "BLOCKDAEMON_API_KEY" }}
              {{- include "wallet-gateway.render.secretEnv" (dict "root" $ "envName" "BLOCKDAEMON_API_KEY") | nindent 12 }}
            {{- end }}

            {{- /* dynamic env vars for oauth2 client secrets from bootstrap networks */ -}}
            {{- range .Values.config.bootstrap.networks }}
              {{- if and .auth .auth.clientSecretEnv }}
                {{- include "wallet-gateway.render.secretEnv" (dict "root" $ "envName" .auth.clientSecretEnv) | nindent 12 }}
              {{- end }}
              {{- if and .adminAuth .adminAuth.clientSecretEnv }}
                {{- include "wallet-gateway.render.secretEnv" (dict "root" $ "envName" .adminAuth.clientSecretEnv) | nindent 12 }}
              {{- end }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.config.server.port }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          volumeMounts:
            - name: config
              mountPath: /app/config.json
              subPath: config.json
      volumes:
        - name: config
          configMap:
            name: "{{ .Release.Name }}-wallet-gateway-config"
