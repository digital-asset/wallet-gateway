apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Release.Name}}-wallet-gateway"
  namespace: "{{ .Release.Namespace }}"
  labels:
    app: "{{ .Release.Name}}-wallet-gateway"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "{{ .Release.Name}}-wallet-gateway"
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: "{{ .Release.Name}}-wallet-gateway"
    spec:
      containers:
        - name: wallet-gateway
          image: "{{ .Values.image.repo }}/wallet-gateway:{{  .Values.image.tag | default (printf "v%s" .Chart.Version) }}"
          imagePullPolicy: Always
          env:
            {{- /* FIREBLOCKS env vars */ -}}
            {{- if .Values.signing.fireblocks.apiKeyRef }}
            - name: FIREBLOCKS_API_KEY
              valueFrom:
                secretKeyRef:
                  {{- toYaml .Values.signing.fireblocks.apiKeyRef | nindent 18 }}
            {{- end }}

            {{- if .Values.signing.fireblocks.secretRef }}
            - name: FIREBLOCKS_SECRET
              valueFrom:
                secretKeyRef:
                  {{- toYaml .Values.signing.fireblocks.secretRef | nindent 18 }}
            {{- end }}

            {{- /* BLOCKDAEMON env vars */ -}}
            {{- if .Values.signing.blockdaemon.apiUrl }}
            - name: BLOCKDAEMON_API_URL
              value: {{ .Values.signing.blockdaemon.apiUrl | quote }}
            {{- end }}

            {{- if .Values.signing.blockdaemon.apiKeyRef }}
            - name: BLOCKDAEMON_API_KEY
              valueFrom:
                secretKeyRef:
                  {{- toYaml .Values.signing.blockdaemon.apiKeyRef | nindent 18 }}
            {{- end }}

            {{- /* dynamic env vars for oauth2 client secrets from bootstrap networks */ -}}
            {{- range .Values.config.bootstrap.networks }}
                {{- $networks := list .auth .adminAuth }}
                {{- range $networks }}
                  {{- if .clientSecret }}
                    {{- $envName := .clientSecret }}
                    {{- $mapping := index $.Values.oauthSecrets $envName }}
                    {{- /* ONLY render the '- name' if the mapping actually has data */ -}}
                    {{- if and $mapping $mapping.name $mapping.key }}
              - name: {{ $envName }}
                valueFrom:
                  secretKeyRef:
                    {{- include "wallet-gateway.render.secretRef" (dict "ref" $mapping "indent" 8) }}
                    {{- end }}
                  {{- end }}
                {{- end }}
              {{- end }}

          ports:
            - name: http
              containerPort: {{ .Values.config.server.port }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          volumeMounts:
            - name: config
              mountPath: /app/config.json
              subPath: config.json
      volumes:
        - name: config
          configMap:
            name: "{{ .Release.Name }}-wallet-gateway-config"
