oauthSecrets:
  SHARED_CLIENT_SECRET:
    secretRef:
      name: shared-secret
      key: client-secret
  ADMIN_CLIENT_SECRET:
    secretRef:
      name: admin-secret
      key: client-secret
  SERVICE_ACCOUNT_CLIENT_SECRET:
    secretRef:
      name: service-account-secret
      key: client-secret

config:
  bootstrap:
    idps:
      - id: idp-a
        type: oauth
        issuer: https://idp-a.example.com
        configUrl: https://idp-a.example.com/.well-known/openid-configuration
    networks:
      - id: net-a
        name: Network A
        description: Network A
        identityProviderId: idp-a
        ledgerApi:
          baseUrl: https://net-a.example.com
        auth:
          method: client_credentials
          scope: daml_ledger_api
          audience: aud-a
          clientId: user-a
          clientSecretEnv: SHARED_CLIENT_SECRET
        adminAuth:
          method: client_credentials
          scope: daml_ledger_api
          audience: aud-a
          clientId: admin-a
          clientSecretEnv: ADMIN_CLIENT_SECRET
        serviceAccountAuth:
          method: client_credentials
          scope: daml_ledger_api
          audience: aud-a
          clientId: service-account-a
          clientSecretEnv: SERVICE_ACCOUNT_CLIENT_SECRET
      - id: net-b
        name: Network B
        description: Network B shares a client secret with Network A
        identityProviderId: idp-a
        ledgerApi:
          baseUrl: https://net-b.example.com
        auth:
          method: authorization_code
          scope: openid daml_ledger_api offline_access
          audience: aud-b
          clientId: user-b
        adminAuth:
          method: client_credentials
          scope: daml_ledger_api
          audience: aud-b
          clientId: admin-b
          clientSecretEnv: SHARED_CLIENT_SECRET
