# An operator copied the bootstrap section to idps/networks instead of moving it.
oauthSecrets:
  SERVICE_ACCOUNT_CLIENT_SECRET:
    secretRef:
      name: service-account-secret
      key: client-secret

config:
  networks: &networks
    - id: "devnet"
      name: "Canton DevNet (example)"
      description: "Connect to Canton DevNet"
      identityProviderId: "idp-devnet"
      ledgerApi:
        baseUrl: "https://devnet.example.com"
      auth:
        method: "authorization_code"
        clientId: "<oauth_user>"
        scope: "openid daml_ledger_api offline_access"
        audience: "<oauth_audience>"
      adminAuth:
        method: "client_credentials"
        scope: "daml_ledger_api"
        audience: "<oauth_audience>"
        clientId: "<oauth_admin_client_id>"
        clientSecretEnv: "OAUTH2_DEVNET_CLIENT_SECRET"
      serviceAccountAuth:
        method: "client_credentials"
        scope: "daml_ledger_api"
        audience: "<oauth_audience>"
        clientId: "<oauth_service_account_client_id>"
        clientSecretEnv: "SERVICE_ACCOUNT_CLIENT_SECRET"
  bootstrap:
    idps:
      - id: "idp-devnet"
        type: "oauth"
        issuer: "<oauth_issuer>"
        configUrl: "http://oauth.example.com/.well-known/openid-configuration"
    networks: *networks
